
name: Build Blue Big Fish APK

on:
  push:
    branches: [main]
    paths:
      - 'blue-big-fish-android-project-v1.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -q blue-big-fish-android-project-v1.zip -d source
          test -f source/TapMaidWidget_Release/settings.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set Kotlin JVM target
        run: |
          cat > "$RUNNER_TEMP/kotlin-jvm-target.gradle" <<'EOF'
          allprojects {
            afterEvaluate {
              tasks.matching {
                it.name.startsWith("compile") && it.name.endsWith("Kotlin")
              }.configureEach {
                kotlinOptions.jvmTarget = "1.8"
              }
            }
          }
          EOF

      - name: Build debug APK
        working-directory: source/TapMaidWidget_Release
        run: gradle --no-daemon -I "$RUNNER_TEMP/kotlin-jvm-target.gradle" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blue-big-fish-apk
          path: source/TapMaidWidget_Release/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
